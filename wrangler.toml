name = "client-arvind"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages project — build output directory.
# Lets `npx wrangler pages deploy` run with no extra flags once
# `npm run build` has produced dist/. Pages Functions in ./functions are
# picked up automatically and deployed alongside the static site.
pages_build_output_dir = "dist"

# --- Admin panel data store ---
# Database provisioned in the active Cloudflare account.
[[d1_databases]]
binding = "DB"
database_name = "anand-techno-fab-content"
database_id = "44cefad6-714f-4ff3-8b9c-81d19081ff6a"

# --- Admin panel media (images/videos/logo uploads) ---
# Stored on Cloudinary's free tier instead of R2 — no bucket to provision.
# Set these as secrets (never commit real values here):
#   wrangler pages secret put CLOUDINARY_CLOUD_NAME
#   wrangler pages secret put CLOUDINARY_API_KEY
#   wrangler pages secret put CLOUDINARY_API_SECRET
# For local dev, put the same three in a .dev.vars file (gitignored).
# See README.md "Admin Panel Setup" for the full one-time setup.

# --- Contact form email delivery ---
# Every /contact submission is saved to D1 (migrations/0005_enquiries.sql)
# regardless of the below, then emailed to mail@anandtechnofab.com via
# Resend (https://resend.com — free tier is more than enough for a contact
# form). One-time setup:
#   1. Sign up at resend.com and verify the anandtechnofab.com domain there
#      (adds an SPF + DKIM DNS record so mail actually sends "from" it and
#      doesn't land in spam).
#   2. wrangler pages secret put RESEND_API_KEY
# For local dev, put the same key in .dev.vars (gitignored). Until this
# secret is set, enquiries still save to D1 — they just aren't emailed yet.
