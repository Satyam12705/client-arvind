name: Deploy to Cloudflare Pages

# Runs on push to main or to this repo's actual default branch (it isn't
# named "main" here), or manually from the Actions tab.
# Requires two repository secrets to actually deploy:
#   CLOUDFLARE_API_TOKEN   — a Cloudflare API token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account ID
# If either secret is missing, the deploy step just fails with a clear auth
# error from wrangler-action rather than the workflow being skipped — the
# `secrets` context isn't a valid `if:` conditional (GitHub Actions doesn't
# expose it there), so a previous version of this gate silently made the
# entire workflow file fail YAML parsing instead.
on:
  push:
    branches: [main, claude/anand-techno-fab-website-tnqqab]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Without this, wrangler-action installs its own default wrangler
          # (3.90.0), whose peer dependency on an older @cloudflare/workers-types
          # conflicts with this repo's own devDependency (^5.x) and breaks
          # `npm ci` inside the action with an ERESOLVE error. Pin it to the
          # same major version already used in package.json.
          wranglerVersion: "4"
          command: pages deploy dist --project-name=client-arvind
